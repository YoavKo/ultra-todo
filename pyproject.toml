[project]
name = "ultra-todo"
version = "0.1.0"
description = "Local-first GitOps task manager (Flask) with Hebrew/English support"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-babel>=4.0.0",
    "json5>=0.17.3",
    "platformdirs>=4.13.4",
    "waitress>=3.0.2",
]

[project.scripts]
ultra-todo = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
